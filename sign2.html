<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Register form</title>

   <style>
      h1 {
         color: rgb(25, 4, 4);
         text-align: center;
         text-decoration: wavy;
         text-shadow: 10px;
      }

      form {
         background: rgb(106, 103, 103);
         padding: 20px;
         border-radius: 1px;
         text-align: center;
         width: 500px;
         margin: auto;
      }

      .pp {
         padding: 15px;
         border-radius: 15px;
         box-shadow: 0 5px 10px rgba(0, 0, 0, .1);
         background: white;
         width: 400px;
         margin-bottom: 15px;
      }

      .form-btn {
         padding: 10px 20px;
         background-color: rgb(236, 98, 98);
         color: black;
         border: none;
         border-radius: 15px;
         cursor: pointer;
      }
      .form-btn1 {
         padding: 10px 20px;
         background-color: rgb(115, 160, 222);
         color: black;
         border: none;
         border-radius: 15px;
         cursor: pointer;
      }


      .form-btn:hover {
         background-color: red;
      }
      .form-btn1:hover {
         background-color: rgb(13, 0, 255);
      }


      .rdio input {
         margin-right: 10px;
      }
      a{
         text-decoration: none;
      }

      .form p {
         text-align: center;
      }
       header {
            background-color: rgb(165, 163, 163);
            padding: 20px;
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
        }
                .right-section{
            display: flex;
            align-items: center;
            gap: 10px;
            position:absolute;
            left:20px;
            width:10px;
            height:10px;
        }
        
        .button {
            background-color: blue;
            color: white;
            padding: 5px 10px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            
        }
        .logo span {
            color: #f4a261;
        }
        .menu {
            flex-grow: 1;
            text-align: center;
        }
        .menu ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 0;
        }
        .menu ul li {
            display: inline;
        }
        .menu ul li a {
            text-decoration: none;
            color: white;
            font-size: 30px;
        }

        a{
         text-decoration: none;
        }

   </style>

</head>
<body>
<header>
      <nav>
          
          <div class="right-section">
              <img src="D:\se sem1\technologies for web development\clothing store\images\images\Logo.png" alt="noura logo" style="width:130px;height:100px;">
          </div>

          <div class="menu">
              
              <ul>
                  <li><a href="#">Home</a></li>
                  <li><a href="aboutus.html">About Us</a></li>
              </ul>
          </div>
      </nav>
  </header>
  <br><br>
    
   <div class="form" enctype="multipart/form-data">
      <form>
         <h1>Create an Account</h2>
         <input type="text" name="First" class="pp" required placeholder="Enter your First name"><br>
         <input type="text" name="Last" class="pp" required placeholder="Enter your Last name"><br>

        

         <div class="rdio">
            <input type="radio" id="male" name="Gender" value="male">Male
            <input type="radio" id="female" name="Gender" value="female">Female<br>
         </div>
         <br>

         <input type="date" name="DOB" required placeholder="Date of birth" min="1950-01-01" max="2015-12-31"><br><br>
         <input type="text" name="Mobile" class="pp" placeholder="Enter Mobile Number" required title="10 digits" pattern="[0-9]{10}"><br>
         <input type="text" name="Address" class="pp" required placeholder="Enter your Address"><br>
         <input type="email" name="email" class="pp" required placeholder="Enter your email"><br>
         <input type="password" name="password" class="pp" required placeholder="Enter your password"><br>
         <input type="password" name="cpassword" class="pp" required placeholder="Confirm your password"><br><br>
         <input type="submit" name="submit" value="Register now" class="form-btn"><br>
         <p>Already have an account? <a href="#" class="form-btn1">Login now</a></p><br><br>
      </form>
   </div>
</body>
</html>
